name: Build APK Zaynix Flexy
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Repo
        uses: actions/checkout@v4

      - name: Siapkan Java Lingkungan Kerja
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Modern
        uses: android-actions/setup-android@v3

      - name: Kompilasi Menjadi APK Android 15
        run: |
          mkdir -p bin/classes/com/zaynix/flexy
          javac -d bin/classes -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar MainActivity.java
          $ANDROID_HOME/build-tools/34.0.0/dx --dex --output=bin/classes.dex bin/classes
          
          mkdir -p bin/res/layout
          echo '<manifest xmlns:android="http://android.com" package="com.zaynix.flexy"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Zaynix Flexy"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > bin/AndroidManifest.xml
          
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M bin/AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F bin/ZaynixFlexy-unaligned.apk bin/
          
          cd bin
          zip -u ZaynixFlexy-unaligned.apk classes.dex
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out ZaynixFlexy.apk ZaynixFlexy-unaligned.apk

      - name: Kirim File APK ke Halaman Download
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Flexy-APK
          path: bin/ZaynixFlexy.apk
          
