name: Build Android APK Final Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: 2. Siapkan Mesin Java Terbaru
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Siapkan Mesin Flutter Terbaru
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Pembersihan Total & Reset Folder Android (BRANDED ZAYNIX FLEXY)
        run: |
          rm -rf Hello-World.zip pubspec.yaml android ios lib web windows macos linux
          flutter create zaynix_flexy --org com.zaynix.flexy
          cp -r zaynix_flexy/* .
          rm -rf zaynix_flexy

      - name: 5. Suntik Kode Menu Zaynix Flexy Hijau Neon Resmi
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const ZaynixFlexyApp());
          }

          class ZaynixFlexyApp extends StatelessWidget {
            const ZaynixFlexyApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Zaynix Flexy',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xff06090E), 
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({Key? key}) : super(key: key);

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            bool _dynamicSensi = false;
            bool _aimDragPath = false;
            bool _recoilController = false;
            bool _easyDrag = false;
            bool _dpiManager = false;
            bool _resolusiManager = false;
            bool _optimizeGo = false;
            bool _freeFireInject = false;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xff06090E),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text(
                          'ZAYNIX FLEXY',
                          style: TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                            color: Color(0xff00FF66), 
                            letterSpacing: 1.5,
                          ),
                        ),
                        const Text(
                          'Tools Inject & Utility',
                          style: TextStyle(color: Colors.grey, fontSize: 12),
                        ),
                        const SizedBox(height: 25),

                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xff00FF66),
                              padding: const EdgeInsets.symmetric(vertical: 14),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                            ),
                            onPressed: () {},
                            child: const Text(
                              'JALANKAN DATA CORE',
                              style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold),
                            ),
                          ),
                        ),
                        const SizedBox(height: 20),

                        _buildFeatureCard('Dynamic Sensitivity', 'Bisa set sensitivitas lebih tinggi untuk respon cepat.', _dynamicSensi, (v) => setState(() => _dynamicSensi = v)),
                        _buildFeatureCard('AimDrag Path', 'Membantu mengarahkan crosshair ke target lebih akurat.', _aimDragPath, (v) => setState(() => _aimDragPath = v)),
                        _buildFeatureCard('Recoil Controller', 'Menyeimbangkan hentakan senjata saat menembak.', _recoilController, (v) => setState(() => _recoilController = v)),
                        _buildFeatureCard('EasyDrag', 'Memudahkan melakukan slide atau drag UI elemen game.', _easyDrag, (v) => setState(() => _easyDrag = v)),
                        _buildFeatureCard('DPI-Manager [NEW]', 'Mengubah settingan kerapatan layar sistem otomatis.', _dpiManager, (v) => setState(() => _dpiManager = v)),
                        _buildFeatureCard('Resolusi Manager', 'Mengubah resolusi internal sistem Android.', _resolusiManager, (v) => setState(() => _resolusiManager = v)),
                        _buildFeatureCard('OptimizeGo', 'Membersihkan cache RAM dan mendongkrak performa sistem.', _optimizeGo, (v) => setState(() => _optimizeGo = v)),
                        _buildFeatureCard('Free Fire Inject System', 'Optimasi Game Mode terarah untuk Free Fire standar.', _freeFireInject, (v) => setState(() => _freeFireInject = v)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildFeatureCard(String title, String subtitle, bool value, ValueChanged<bool> onChanged) {
              return Container(
                margin: const EdgeInsets.only(bottom: 14),
                decoration: BoxDecoration(
                  color: const Color(0xff121820),
                  borderRadius: BorderRadius.circular(12),
                  border: Border.all(
                    color: value ? const Color(0xff00FF66) : const Color(0xff1C2431),
                    width: 2,
                  ),
                ),
                child: Padding(
                  padding: const EdgeInsets.all(14.0),
                  child: Row(
                    children: [
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(title, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                            const SizedBox(height: 4),
                            Text(subtitle, style: const TextStyle(color: Colors.grey, fontSize: 11)),
                          ],
                        ),
                      ),
                      Switch(
                        value: value, 
                        onChanged: onChanged, 
                        activeColor: const Color(0xff00FF66)
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: 6. Ambil Library Resmi
        run: flutter pub get

      - name: 7. Proses Perakitan Akhir Aplikasi APK
        run: flutter build apk --debug

      - name: 8. Bungkus dan Kirim File APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Flexy-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
